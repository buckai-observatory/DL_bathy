[build-system]
# setuptools 77 is the first to accept an SPDX license expression
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "dl-bathy"
dynamic = ["version"]
description = "Deep-learning satellite-derived bathymetry from Sentinel-2 imagery with LiDAR ground truth"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Hsiao-Jou Hsu"}, {name = "Joachim Moortgat"}]
requires-python = ">=3.10"
keywords = ["bathymetry", "remote sensing", "Sentinel-2", "LiDAR", "deep learning"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: GIS",
]
# Core: patch preparation from local scenes (`sdb split`)
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "scipy",
    "scikit-image",
    "rasterio",
    "pyyaml",
]

[project.optional-dependencies]
train = ["torch", "torchvision", "segmentation-models-pytorch"]
inference = ["torch", "torchvision", "segmentation-models-pytorch", "huggingface_hub"]
fetch = ["geoai-datacubes"]
# pyTMD reads the EOT20 NetCDF files through h5netcdf, which needs h5py.
tide = ["pyTMD", "h5py"]
dev = ["pytest"]
# Documentation website: API reference from docstrings. quartodoc 0.11 is not
# compatible with griffe 2.x.
docs = ["quartodoc>=0.10", "griffe<2"]
all = ["dl-bathy[train,inference,fetch,tide]"]

[project.scripts]
sdb = "dl_bathy.cli:main"

[project.urls]
Repository = "https://github.com/buckai-observatory/DL_bathy"

[tool.setuptools]
packages = ["dl_bathy"]
py-modules = ["losses", "inference"]

[tool.setuptools_scm]
fallback_version = "0.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The tests write about 3 GB of temporary patches per run; keep them only
# for failed tests instead of for the last three runs.
tmp_path_retention_policy = "failed"

# ---------------------------------------------------------------------------
# Reproducible environment with pixi (https://pixi.sh). pixi.lock pins every
# package for macOS (Apple silicon and Intel), Linux and Windows. See the
# README, "Reproducible environment with pixi". The packages mirror
# requirements.txt and the [all] extra, resolved from conda-forge; keep them
# in sync.
# ---------------------------------------------------------------------------
[tool.pixi.workspace]
name = "dl-bathy"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10,<3.13"
numpy = "*"
pandas = "*"
matplotlib-base = "*"
scipy = "*"
scikit-image = "*"
rasterio = "*"
pyyaml = "*"
pytorch = "*"
torchvision = "*"
segmentation-models-pytorch = "*"
huggingface_hub = "*"
pytmd = "*"
h5py = "*"
pip = "*"

# geoai-datacubes comes from PyPI, and the package itself is installed in
# editable mode so the `sdb` command and `import inference` work.
[tool.pixi.pypi-dependencies]
geoai-datacubes = ">=1.1"
dl-bathy = { path = ".", editable = true }

[tool.pixi.feature.test.dependencies]
pytest = "*"

[tool.pixi.feature.notebook.dependencies]
jupyterlab = ">=4"
ipykernel = "*"
nbconvert = "*"

# Jupyter looks for kernels in the user's own folder (e.g. ~/Library/Jupyter
# on macOS) before the environment's. A "python3" kernel there, left by
# another installation, would then run the notebook with a Python that lacks
# DL_bathy. JUPYTER_PATH puts the environment's own kernel first.
[tool.pixi.feature.notebook.activation.env]
JUPYTER_PATH = "$CONDA_PREFIX/share/jupyter"

[tool.pixi.feature.notebook.target.win-64.activation.env]
JUPYTER_PATH = "%CONDA_PREFIX%\\share\\jupyter"

[tool.pixi.environments]
default = { features = [], solve-group = "default" }
test = { features = ["test"], solve-group = "default" }
notebook = { features = ["notebook"], solve-group = "default" }

[tool.pixi.feature.test.tasks]
test = { cmd = "pytest tests/", description = "Run the test suite" }

[tool.pixi.feature.notebook.tasks]
# Named `lab`, not `jupyter`: a task named after an executable would shadow it.
lab = { cmd = "jupyter lab notebooks/dl_bathy_demo.ipynb", description = "Open the demo notebook in JupyterLab" }
